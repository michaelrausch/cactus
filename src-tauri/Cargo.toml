[package]
name = "cactus"
version.workspace = true
edition.workspace = true

[lib]
name = "cactus_app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cactus-core = { path = "../core", features = ["specta", "git"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["sync", "macros", "time"] }
notify-debouncer-mini = "0.6"
# specta is pre-1.0: pin exact versions so the generated bindings stay stable.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

[features]
# Secret encryption. The commands exist either way, so the UI's bindings
# don't change; without it they report encryption as off.
encryption = ["cactus-core/encryption"]

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }
tempfile = "3"

[lints]
workspace = true
