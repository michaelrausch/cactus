[package]
name = "cactus"
version.workspace = true
edition.workspace = true

[lib]
name = "cactus_app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cactus-core = { path = "../core", features = ["specta", "git"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["sync", "macros", "time", "net"] }
notify-debouncer-mini = "0.6"
# The MCP server (`mcp/`): Streamable HTTP on loopback, for agents.
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
schemars = "1"
tokio-util = "0.7"
# The MCP server's bearer token.
getrandom = "0.3"
# specta is pre-1.0: pin exact versions so the generated bindings stay stable.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

[features]
# The Pro edition: a separate binary that asks for a license key first.
pro = ["cactus-core/pro"]

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "io-util"] }
tempfile = "3"

[lints]
workspace = true
