name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3
          # Recommends pull in GStreamer, PulseAudio and more that only playing
          # media needs; skipping them keeps this to the libraries Tauri links.
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/ui/package-lock.json
            apps/site/package-lock.json
            apps/docs/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix apps/desktop/ui

      # The desktop crate embeds apps/desktop/ui/dist at compile time, so build it first.
      - name: Build UI
        run: npm run build --prefix apps/desktop/ui

      - name: UI checks
        run: |
          npm run lint --prefix apps/desktop/ui
          npm run format:check --prefix apps/desktop/ui
          npm test --prefix apps/desktop/ui
          CACTUS_EDITION=pro npm test --prefix apps/desktop/ui

      - name: Site and docs build
        run: |
          npm ci --prefix apps/site
          npm run build --prefix apps/site
          npm ci --prefix apps/docs
          npm run build --prefix apps/docs

      - name: rustfmt
        run: cargo fmt --all --check

      # The CLI and license-gen build core with `pro`, so the workspace is the
      # Pro edition; the free one is the desktop app on its own.
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --features cactus/pro -- -D warnings
          cargo clippy -p cactus -p cactus-core --all-targets -- -D warnings

      - name: Rust tests
        run: |
          cargo test --workspace --features cactus/pro
          cargo test -p cactus -p cactus-core

      # `cargo test -p cactus --features pro` regenerates the TypeScript bindings.
      - name: Bindings are up to date
        run: git diff --exit-code apps/desktop/ui/src/api/bindings.ts

