name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (${{ matrix.edition.name }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        edition:
          - { name: free, prefix: cactus, binary: cactus, config: "" }
          - { name: pro, prefix: cactus-pro, binary: "cactus pro", config: "--config apps/desktop/src-tauri/tauri.pro.conf.json" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix apps/desktop/ui
      - name: Build NSIS installer
        run: npm run build:desktop -- --bundles nsis ${{ matrix.edition.config }}
      # The release binary embeds the UI and runs without installing
      # (WebView2 ships with Windows 10/11).
      - name: Stage portable exe
        shell: bash
        run: |
          mkdir dist
          # mainBinaryName: "cactus pro.exe" in the Pro build.
          cp "target/release/${{ matrix.edition.binary }}.exe" "dist/${{ matrix.edition.prefix }}_${GITHUB_REF_NAME}_x64_portable.exe"
          # Named by prefix, not productName: "cactus pro" would have a space in it.
          cp target/release/bundle/nsis/*.exe "dist/${{ matrix.edition.prefix }}_${GITHUB_REF_NAME#v}_x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition.prefix }}-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.edition.name }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      matrix:
        edition:
          - { name: free, prefix: cactus, config: "" }
          - { name: pro, prefix: cactus-pro, config: "--config apps/desktop/src-tauri/tauri.pro.conf.json" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix apps/desktop/ui
      # Tauri signs with the Developer ID certificate and notarizes when these are set.
      - name: Build universal DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:desktop -- --target universal-apple-darwin --bundles dmg ${{ matrix.edition.config }}
      - name: Stage DMG
        run: |
          mkdir dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/${{ matrix.edition.prefix }}_${GITHUB_REF_NAME#v}_universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition.prefix }}-macos
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
