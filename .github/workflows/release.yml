name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      # Run from the repository root: the CLI finds src-tauri/ (and the UI's
      # package.json for beforeBuildCommand) by searching below the current folder.
      - name: Build NSIS installer
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build --bundles nsis
      # The release binary embeds the UI and runs without installing
      # (WebView2 ships with Windows 10/11).
      - name: Stage portable exe
        shell: bash
        run: |
          mkdir dist
          cp target/release/cactus.exe "dist/cactus_${GITHUB_REF_NAME}_x64_portable.exe"
          cp target/release/bundle/nsis/*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cactus-windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build universal DMG
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cactus-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
