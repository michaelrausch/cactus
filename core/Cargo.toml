[package]
name = "cactus-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
walkdir = "2"
serde_yaml = "0.9"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "http2", "multipart"] }

[features]
# Derive TypeScript-exportable types for the desktop app's generated bindings.
specta = ["dep:specta"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true
