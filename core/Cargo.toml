[package]
name = "cactus-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
walkdir = "2"
serde_yaml_ng = "0.10"
yaml-edit = { version = "0.3.6", default-features = false }
rowan = "0.16"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"], optional = true }
specta-typescript = { version = "=0.0.15", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "http2", "multipart", "cookies"] }
# Each critter's cookie jar (`cookies`): the store reqwest's `cookies` feature uses.
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
# Digest auth's challenge parsing and response (RFC 7616).
digest_auth = "0.3"
# OAuth2 PKCE's S256 code challenge.
sha2 = "0.11"
# Already in the tree through reqwest; OAuth2 checks callback hosts with it.
url = "2"
# Local repository work only: without https/ssh there is no OpenSSL or libssh2
# to build, and the vendored libgit2 builds the same on Linux and Windows.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"], optional = true }
# Secrets and context files at rest (`secrets::vault`): pure Rust, no OpenSSL.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
# The vault's optional TOTP: RFC 6238 codes, base32 secrets and a QR code to scan.
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Vault salts and nonces, and generated values in flows (`$uuid`).
getrandom = "0.3"
# Already in the tree through reqwest; flows' `wait` tool sleeps with it.
# OAuth2's authorization code arrives on a loopback listener (`net`, `io-util`);
# the cookie jar of a send is a task-local (`rt`).
tokio = { version = "1", features = ["time", "rt", "net", "io-util"] }
# Already in the tree through reqwest; `fuzz`, `ratelimit` and `loadtest`
# send their probes several at a time with it.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Already in the tree through reqwest; the `cert` tool makes its own TLS
# handshake to look at the certificate, even one reqwest would refuse.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# The `cert` tool reads the certificate: dates, names, key and signature.
x509-parser = "0.18"

[features]
# Derive TypeScript-exportable types for the desktop app's generated bindings.
specta = ["dep:specta", "dep:specta-typescript"]
# Stage, diff and commit in the project's git repository (desktop app only).
git = ["dep:git2"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
tempfile = "3"
jsonschema = { version = "0.63", default-features = false }
# Certificates for the `cert` tool's tests.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
