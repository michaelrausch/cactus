[package]
name = "cactus-cli"
version.workspace = true
edition.workspace = true

[dependencies]
cactus-core = { path = "../core" }
clap = { version = "4.6.9", features = ["derive"] }
rpassword = { version = "7.5.5", optional = true }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }

[features]
# Secret encryption: `--password-stdin` and the `secrets` command.
encryption = ["cactus-core/encryption", "dep:rpassword"]

[lints]
workspace = true
